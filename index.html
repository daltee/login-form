<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUST Application Portal | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient background shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="page-shell">
        <!-- Glass card -->
        <main class="portal-card">
            <header class="portal-header">
                <!-- Circular glass logo frame -->
                <div class="logo-frame">
                    <img src="images/image.png" alt="MUST Logo" class="portal-logo">
                </div>
                <h1 class="portal-title">Application Portal</h1>
                <p class="portal-subtitle">Mbarara University of Science and Technology</p>
            </header>

            <!-- Page tabs -->
            <nav class="tab-headers" aria-label="Account access">
                <a href="index.html" class="tab-link active">Login</a>
                <a href="signup.html" class="tab-link">Create Account</a>
            </nav>

            <section class="form-panel">
                <form action="#">
                    <!-- type="text" so student numbers are accepted -->
                    <div class="form-group">
                        <label for="login-email">Student Number / Email</label>
                        <input type="text" id="login-email" placeholder="Enter your ID or email" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <div class="options">
                        <label class="remember-option">
                            <input type="checkbox" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn">Login</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            &copy; 2026 Mutebi Dalton | SWE. All rights reserved.
        </footer>
    </div>
</body>
</html>
