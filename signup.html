<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUST Application Portal | Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative blurred background shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="page-shell">
        <!-- Main glass-style signup card -->
        <main class="portal-card">
            <header class="portal-header">
                <div class="logo-frame">
                    <img src="images/image.png" alt="MUST Logo" class="portal-logo">
                </div>
                <h1 class="portal-title">Application Portal</h1>
                <p class="portal-subtitle">Mbarara University of Science and Technology</p>
            </header>

            <nav class="tab-headers" aria-label="Account access">
                <a href="index.html" class="tab-link">Login</a>
                <a href="signup.html" class="tab-link active">Create Account</a>
            </nav>

            <!-- Signup form with grouped personal and account fields -->
            <section class="form-panel">
                <form action="#">
                    <!-- Two-column rows collapse to one column on small screens -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="signup-fname">First Name</label>
                            <input type="text" id="signup-fname" placeholder="First Name" autocomplete="given-name" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-lname">Last Name</label>
                            <input type="text" id="signup-lname" placeholder="Last Name" autocomplete="family-name" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="signup-email">Email Address</label>
                            <input type="email" id="signup-email" placeholder="Email Address" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-phone">Phone Number</label>
                            <input type="tel" id="signup-phone" placeholder="Phone Number" autocomplete="tel" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-program">Program of Study</label>
                        <select id="signup-program" required>
                            <option value="" disabled selected>Select a program...</option>
                            <option value="software-eng">BSc Software Engineering</option>
                            <option value="comp-sci">BSc Computer Science</option>
                            <option value="med-surg">Bachelor of Medicine and Surgery</option>
                            <option value="nursing">BSc Nursing</option>
                            <option value="bus-admin">Bachelor of Business Administration</option>
                            <option value="info-tech">BSc Information Technology</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <input type="password" id="signup-password" placeholder="Create password" autocomplete="new-password" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-password-confirm">Confirm Password</label>
                            <input type="password" id="signup-password-confirm" placeholder="Confirm password" autocomplete="new-password" required>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Register</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            &copy; 2026 Mutebi Dalton | SWE. All rights reserved.
        </footer>
    </div>
</body>
</html>
